# SecretStore — Vault local (in-cluster) como backend de segredos (Fase 3).
# A credencial (vault-token) é criada pelo bootstrap.sh a partir do token que
# existe apenas no host — nada de segredos neste repositório.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: medusa-jobs
  labels:
    app.kubernetes.io/part-of: medusa
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
