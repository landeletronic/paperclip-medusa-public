# ExternalSecret — materializa o Secret `medusa-app-secret` a partir do Vault.
# Rotação: valor novo em secret/medusa (Vault) é sincronizado em até
# refreshInterval (15 s) — provado no aceite da Fase 3 (F3.2).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: medusa-app-credentials
  namespace: medusa-jobs
  labels:
    app.kubernetes.io/part-of: medusa
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: medusa-app-secret
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: medusa
        property: api-key
