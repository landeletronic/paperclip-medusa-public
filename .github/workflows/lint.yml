name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint e sintaxe
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Instalar Yamllint
        run: python -m pip install --disable-pip-version-check yamllint==1.37.1

      - name: Instalar ShellCheck com checksum
        shell: bash
        run: |
          set -euo pipefail
          version=0.11.0
          archive="shellcheck-v${version}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${version}/${archive}"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  ${archive}" | sha256sum -c -
          tar -xJf "${archive}"
          sudo install -m 0755 "shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck

      - name: Instalar actionlint com checksum
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -fsSLO "${base}/actionlint_${version}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_${version}_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf "actionlint_${version}_linux_amd64.tar.gz" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Instalar Hadolint com checksum
        shell: bash
        run: |
          set -euo pipefail
          version=2.15.1
          base="https://github.com/hadolint/hadolint/releases/download/v${version}"
          curl -fsSL "${base}/hadolint-linux-x86_64" -o hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  hadolint-linux-x86_64" | sha256sum -c -
          sudo install -m 0755 hadolint-linux-x86_64 /usr/local/bin/hadolint

      - name: Markdownlint
        run: npx --yes markdownlint-cli2@0.24.1 "**/*.md"

      - name: Yamllint
        run: yamllint -c .yamllint.yml .

      - name: Actionlint
        run: actionlint

      - name: ShellCheck
        shell: bash
        run: |
          mapfile -d '' files < <(find src scripts -type f -name '*.sh' -print0)
          if ((${#files[@]})); then shellcheck "${files[@]}"; fi

      - name: Hadolint
        shell: bash
        run: |
          mapfile -d '' files < <(find src -type f -name 'Dockerfile' -print0)
          if ((${#files[@]})); then hadolint "${files[@]}"; fi

      - name: Sintaxe Python
        shell: bash
        run: |
          mapfile -d '' files < <(find src -type f -name '*.py' -print0)
          if ((${#files[@]})); then python -m py_compile "${files[@]}"; fi

      - name: Sintaxe JavaScript
        shell: bash
        run: |
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src -type f -name '*.mjs' -print0)

      - name: JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if '.git' not in path.parts:
                  json.loads(path.read_text(encoding='utf-8'))
          PY
