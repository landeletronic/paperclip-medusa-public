name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Validar estrutura
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validar raiz e diretorios
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(find . -maxdepth 1 -type f ! -name 'README.md' ! -name 'AGENTS.md' ! -name 'opencode.json' ! -name 'LICENSE' ! -name 'NOTICE' ! -name 'CONTRIBUTING.md' ! -name 'CHANGELOG.md' ! -name 'SECURITY.md' ! -name 'AGENTS.override.md' ! -name '.gitignore' ! -name '.gitattributes' ! -name '.editorconfig' ! -name '.gitleaks.toml' ! -name '.hadolint.yaml' ! -name '.markdownlint-cli2.yaml' ! -name '.yamllint.yml' -print)
          if [ -n "$unexpected" ]; then
            echo "Arquivos inesperados na raiz:"
            echo "$unexpected"
            exit 1
          fi
          for d in docs docs/agents docs/plans logs scripts templates src .github/workflows .github/ISSUE_TEMPLATE; do
            if [ ! -d "$d" ]; then
              echo "Diretorio ausente: $d"
              exit 1
            fi
          done
          for f in README.md AGENTS.md opencode.json LICENSE NOTICE CONTRIBUTING.md CHANGELOG.md SECURITY.md docs/README.md docs/CONVENTIONS.md docs/GIT_WORKFLOW.md docs/agents/README.md docs/agents/OPENCODE.md docs/agents/HERMES.md docs/agents/MEMORY.md .gitleaks.toml .hadolint.yaml .markdownlint-cli2.yaml .yamllint.yml .github/PULL_REQUEST_TEMPLATE.md .github/dependabot.yml .github/ISSUE_TEMPLATE/bug_report.yml .github/ISSUE_TEMPLATE/feature_request.yml .github/ISSUE_TEMPLATE/config.yml .github/workflows/validate.yml .github/workflows/lint.yml .github/workflows/security.yml; do
            if [ ! -f "$f" ]; then
              echo "Arquivo ausente: $f"
              exit 1
            fi
          done
          if [ -f .hermes.md ] || [ -f HERMES.md ]; then
            echo "Arquivo de contexto conflitante na raiz: .hermes.md ou HERMES.md"
            exit 1
          fi
          python3 -c "import json; json.load(open('opencode.json', encoding='utf-8'))"
          echo "Raiz, diretorios, arquivos e opencode.json OK."

      - name: Executar validador estrutural PowerShell
        shell: pwsh
        run: ./scripts/Test-RepositoryStructure.ps1

      - name: Validar nomenclatura dos logs
        shell: bash
        run: |
          set -euo pipefail
          bad=$(find logs -type f -name '*.md' ! -name 'README.md' -print | grep -Ev '/[0-9]{4}-[0-9]{2}-[0-9]{2}-(session|command|execution|task|test|inventory)-[0-9]{3}-[a-z0-9-]+\.md$' || true)
          if [ -n "$bad" ]; then
            echo "Registros fora do padrao:"
            echo "$bad"
            exit 1
          fi
          echo "Nomenclatura OK."

      - name: Validar segredos de alta confianca
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            --include='*.md' --include='*.ps1' --include='*.yml' --include='*.yaml' --include='*.json' --include='*.txt' \
            --exclude='validate.yml' --exclude='Test-RepositoryStructure.ps1' .; then
            echo "Possivel segredo detectado."
            exit 1
          fi
          echo "Nenhum segredo de alta confianca detectado."
